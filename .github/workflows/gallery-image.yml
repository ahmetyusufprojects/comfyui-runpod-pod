name: RunPod gallery image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gallery-image.yml'
      - 'docker/stable-image.txt'
      - 'docker/Dockerfile.gallery'
      - 'docker/models.json'
      - 'docker/supervisor.py'
      - 'tests/**'
      - 'webui_flux2/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check Python and setup UI syntax
        run: |
          set -eu
          python3 -m py_compile webui_flux2/*.py pod-launch.py tests/*.py
          node --check webui_flux2/static/app.js
          node --check webui_flux2/static/setup.js
          node tests/app_selection_smoke.js
          python3 tests/qwen_image_edit_smoke.py
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          catalog = json.loads(Path('docker/models.json').read_text())
          assert catalog['schema'] == 2
          assert catalog['groups']['flux3']['enabled'] is True
          assert catalog['workflows']['flux3']['steps'] == 16
          assert 'flux3-image-klein-base' not in json.dumps(catalog['groups']['flux3'])
          flux3_files = catalog['groups']['flux3']['files']
          assert flux3_files[0]['repo'] == 'black-forest-labs/flux-3-image-klein-comfy'
          assert flux3_files[1]['repo'] == 'ahmed22xa/Huihui-Qwen3-VL-4B-Instruct-abliterated-comfy'
          assert flux3_files[1]['name'] == 'Huihui-Qwen3-VL-4B-Instruct-abliterated-int8_convrot.safetensors'
          assert flux3_files[1]['sha256'] == '6a108cd7715c8e1300d4b82b2e671bdedcea65d07406ae454f00720444830209'
          assert 'RUNPOD_SECRET_HfToken2' in Path('pod-launch.py').read_text()
          assert catalog['workflows']['illustrious']['lora_group'] == 'anime_desire_lora'
          assert catalog['workflows']['illustrious']['steps'] == 28
          assert catalog['workflows']['illustrious']['cfg'] == 5.0
          qwen_edit = catalog['groups']['qwen_image_edit']
          qwen_turbo = catalog['groups']['qwen_image_edit_turbo']
          assert qwen_edit['enabled'] is True
          assert qwen_edit['files'][0]['name'] == 'qwen_image_2.1_int8_convrot.safetensors'
          assert qwen_edit['files'][0]['sha256'] == 'cb74113cb03faecd79611b01fd7fd642f0aa60d6f0b95086abee214d75eaa57d'
          assert qwen_edit['files'][1]['name'] == 'qwen3vl_8b_int8_convrot_heretic.safetensors'
          assert qwen_edit['files'][1]['sha256'] == 'f15ce4275428e04f42cdb59e3a253cb290cae5de99259527f01d3d2e51153653'
          assert 'depends_on' not in qwen_turbo
          assert qwen_turbo['files'][0]['name'] == 'qwen_image_2.1_turbo_int8_convrot.safetensors'
          assert qwen_turbo['files'][0]['sha256'] == '8144a0182964aa8403ad6dbc011db837304167d235161b9aabaa8532e967314c'
          assert qwen_edit['files'][2]['sha256'] == 'bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9'
          assert catalog['workflows']['qwen_image_edit']['steps'] == 25
          assert catalog['workflows']['qwen_image_edit_turbo']['steps'] == 8
          assert len(catalog['workflows']['qwen_image_edit_turbo']['sigmas'].split(',')) == 9
          qwen = catalog['groups']['llm_qwen27b']['files']
          assert len(qwen) == 2
          assert qwen[0]['name'] == 'Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-MTP-Q4_K_M.gguf'
          assert qwen[0]['size'] == 18498573856
          assert qwen[0]['sha256'] == 'bc7a6cf2bcc78d1190aaf04d1ab1c5cb845b6ff23aa0e7d24fe0d2ea6d3a7c7c'
          assert qwen[1]['name'] == 'mmproj-F16.gguf' and qwen[1]['optional'] is True
          assert catalog['workflows']['llm_qwen27b']['mtp_embedded'] is True
          assert 'anima' not in catalog['groups']
          assert 'moody' not in catalog['groups']
          assert 'anima' not in catalog['workflows']
          assert 'moody_anima' not in catalog['workflows']
          assert catalog['llm_default'] == 'llm_26b'
          assert 'llama' not in catalog['workflows']
          assert 'llm_12b' not in catalog['workflows']
          assert runpy.run_path('pod-launch.py')['current_image']() == \
              'ghcr.io/ahmetyusufprojects/comfyui-runpod-pod:latest'
          publish = Path('.github/workflows/gallery-image.yml').read_text()
          assert 'current_image="${repository}:latest"' in publish
          assert 'beta_image="${repository}:beta"' in publish
          assert 'versioned_image="${repository}:gallery-${GITHUB_SHA}"' in publish
          print('model catalog checks passed')
          PY
      - name: Build Linux image
        run: docker build -f docker/Dockerfile.gallery -t webui-gallery .
      - name: Verify no-volume first run and gallery HTTP start
        run: |
          set -eu
          python3 - <<'PY'
          import http.cookiejar, json, secrets, subprocess, time, urllib.request
          subprocess.run(["docker", "run", "-d", "--name", "gallery-check",
                          "-e", "WEBUI_AUTO_DOWNLOAD=0",
                          "-p", "127.0.0.1:8189:8189", "-p", "127.0.0.1:8192:8192", "webui-gallery"],
                         check=True, stdout=subprocess.DEVNULL)
          state = None
          for _ in range(40):
              try:
                  state = json.load(urllib.request.urlopen(
                      "http://127.0.0.1:8192/api/setup-state", timeout=2))
                  if state.get("hazir"):
                      break
                  time.sleep(0.5)
              except (OSError, ValueError):
                  time.sleep(0.5)
          if not state or not state.get("hazir"):
              subprocess.run(["docker", "logs", "gallery-check"], check=False)
              raise SystemExit("Gallery did not start correctly without a volume")
          assert state["storage_mode"] == "ephemeral", state
          setup = urllib.request.urlopen("http://127.0.0.1:8192/", timeout=2).read()
          assert b"Model kurulumu" in setup
          assert "Model ekle veya adını değiştir" in setup.decode("utf-8")
          first_run = json.load(urllib.request.urlopen(
              "http://127.0.0.1:8189/api/kurulum-durumu", timeout=2))
          assert first_run == {"kurulu": False, "runpod": True,
                               "storage_mode": "ephemeral",
                               "storage_persistent": False}, first_run
          installer = json.load(urllib.request.urlopen(
              "http://127.0.0.1:8192/api/pod-kurulum", timeout=2))
          assert installer["hazir"] is True and installer["storage_mode"] == "ephemeral", installer
          password = secrets.token_urlsafe(18)
          payload = json.dumps({"kullanici": "synthetic", "sifre": password}).encode()
          request = urllib.request.Request("http://127.0.0.1:8189/api/kurulum",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          created = json.load(urllib.request.urlopen(request, timeout=10))
          assert created["kullanici"] == "synthetic" and created["rol"] == "admin", created
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(
              http.cookiejar.CookieJar()))
          login = urllib.request.Request("http://127.0.0.1:8189/api/giris",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          logged_in = json.load(opener.open(login, timeout=10))
          assert logged_in["rol"] == "admin", logged_in
          me = json.load(opener.open("http://127.0.0.1:8189/api/ben", timeout=5))
          assert me["kullanici"] == "synthetic" and me["rol"] == "admin", me
          installed = json.load(urllib.request.urlopen(
              "http://127.0.0.1:8189/api/kurulum-durumu", timeout=2))
          assert installed["kurulu"] is True and installed["storage_mode"] == "ephemeral", installed
          assert b"podKurulum" in urllib.request.urlopen("http://127.0.0.1:8189/").read()
          print("gallery starts with no volume; setup, first admin, login, and installer work")
          PY
      - name: Verify model download and cancellation workers
        run: |
          set -eu
          docker cp tests/pod_setup_smoke.py gallery-check:/tmp/pod_setup_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/pod_setup_smoke.py
      - name: Verify encrypted vault password rotation
        run: |
          set -eu
          docker cp tests/kasa_password_rotation_smoke.py gallery-check:/tmp/kasa_password_rotation_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/kasa_password_rotation_smoke.py
      - name: Verify full-system encrypted backup and restore
        run: |
          set -eu
          docker cp tests/system_backup_smoke.py gallery-check:/tmp/system_backup_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/system_backup_smoke.py
      - name: Verify explicit LLM model selection
        run: |
          set -eu
          docker cp tests/llm_model_manual_smoke.py gallery-check:/tmp/llm_model_manual_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/llm_model_manual_smoke.py
      - name: Verify passwordless installer, storage cleaning, and archive deletion
        run: |
          set -eu
          docker cp tests/installer_storage_archive_smoke.py gallery-check:/tmp/installer_storage_archive_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/installer_storage_archive_smoke.py
      - name: Verify application update and rollback
        run: |
          set -eu
          docker cp tests/app_update_integration.py gallery-check:/tmp/app_update_integration.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/app_update_integration.py
      - name: Publish the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          versioned_image="${repository}:gallery-${GITHUB_SHA}"
          current_image="${repository}:latest"
          beta_image="${repository}:beta"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag webui-gallery "$versioned_image"
          docker tag webui-gallery "$current_image"
          docker tag webui-gallery "$beta_image"
          docker push "$versioned_image"
          docker push "$current_image"
          docker push "$beta_image"
      - name: Promote the selected image to stable
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_tag="$(tr -d '\r\n' < docker/stable-image.txt)"
          printf '%s' "$source_tag" | grep -Eq '^gallery-[0-9a-f]{40}$'
          source_image="${repository}:${source_tag}"
          stable_image="${repository}:stable"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools inspect "$source_image"
          docker buildx imagetools create --tag "$stable_image" "$source_image"
          docker buildx imagetools inspect "$stable_image"
