name: RunPod gallery image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gallery-image.yml'
      - 'docker/Dockerfile.gallery'
      - 'docker/models.json'
      - 'tests/**'
      - 'webui_flux2/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check Python and setup UI syntax
        run: |
          set -eu
          python3 -m py_compile webui_flux2/*.py
          node --check webui_flux2/static/app.js
          node --check webui_flux2/static/setup.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('docker/models.json').read_text())
          assert catalog['schema'] == 2
          assert catalog['workflows']['flux3']['steps'] == 16
          assert 'flux3-image-klein-base' not in json.dumps(catalog['groups']['flux3'])
          assert catalog['workflows']['illustrious']['lora_group'] == 'anime_desire_lora'
          assert catalog['groups']['anima']['enabled'] is False
          assert catalog['groups']['moody']['enabled'] is False
          assert catalog['llm_defaults']['image']['flux3'] == 'llama'
          assert catalog['llm_defaults']['chat'] == 'llm_26b'
          print('model catalog checks passed')
          PY
      - name: Build Linux image
        run: docker build -f docker/Dockerfile.gallery -t webui-gallery .
      - name: Verify mount guard and gallery HTTP start
        run: |
          set -eu
          if docker run --rm webui-gallery; then
            echo 'Unexpected startup without a persistent mount'
            exit 1
          fi
          python3 - <<'PY'
          import os, secrets, subprocess, time, urllib.request
          env = dict(os.environ, WEBUI_BOOTSTRAP_PASSWORD=secrets.token_urlsafe(32),
                     POD_FLEX_PREFIX="gallery-check")
          subprocess.run(["docker", "run", "-d", "--name", "gallery-check",
                          "--tmpfs", "/workspace", "-e", "WEBUI_BOOTSTRAP_PASSWORD",
                          "-e", "POD_FLEX_PREFIX=gallery-check",
                          "-p", "127.0.0.1:8189:8189", "-p", "127.0.0.1:8192:8192", "webui-gallery"],
                         check=True, env=env, stdout=subprocess.DEVNULL)
          for _ in range(40):
              try:
                  setup = urllib.request.urlopen("http://127.0.0.1:8192/", timeout=2).read()
                  assert b"Model kurulumu" in setup
                  assert urllib.request.urlopen("http://127.0.0.1:8189/api/sunucu-hazir").status == 200
                  assert b"podKurulum" in urllib.request.urlopen("http://127.0.0.1:8189/").read()
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              subprocess.run(["docker", "logs", "gallery-check"], check=False)
              raise SystemExit("Gallery did not start")
          PY
      - name: Verify model download and cancellation workers
        run: |
          set -eu
          docker cp tests/pod_setup_smoke.py gallery-check:/tmp/pod_setup_smoke.py
          docker exec gallery-check /opt/webui-venv/bin/python /tmp/pod_setup_smoke.py
      - name: Publish the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}:gallery-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag webui-gallery "$image"
          docker push "$image"
